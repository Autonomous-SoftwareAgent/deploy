# Workflow DÙNG CHUNG cho mọi dịch vụ (S-023, S-029): sau khi test của dịch vụ qua, quyết định có đóng gói không,
# đóng gói, quét bí mật, rồi đẩy lên Docker Hub (kho công khai) với nhãn main-<12 ký tự commit>.
# KHAI BÁO TRƯỚC, BUILD SAU: chỉ đóng gói khi commit đang chạy đúng là commit dịch vụ đã ghi trong tờ
# services/<dịch-vụ>.json của repo này. Lần đẩy khác chỉ chạy test. Lỡ đẩy trước khi khai: khai xong thì chạy tay lại workflow của dịch vụ.
# Dịch vụ gọi nó từ workflow của mình, SAU job test:
#   image:
#     needs: test
#     uses: Autonomous-SoftwareAgent/deploy/.github/workflows/service-image.yml@main
#     secrets: inherit
# Dịch vụ khai tên và tầng Dockerfile trong bsn.ci.json ở gốc repo của nó: {"service": "<tên>", "dockerTarget": "<tầng, nếu có>"}.
# Chỉ nhánh main (push hoặc chạy tay) mới đóng gói. Không đẩy nhãn latest. Một commit chỉ có một bản.
name: service-image
on:
  workflow_call:
    inputs:
      deploy-repo:
        description: Repo deploy chứa các tệp phụ của CI (ci/)
        type: string
        default: Autonomous-SoftwareAgent/deploy
      deploy-ref:
        type: string
        default: main
      repo-prefix:
        description: Tiền tố tên repo của dịch vụ trên GitHub và Docker Hub
        type: string
        default: svc-
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Lấy mã của dịch vụ (đúng commit đang chạy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lấy tệp phụ của CI và các tờ khai báo từ repo deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.deploy-repo }}
          ref: ${{ inputs.deploy-ref }}
          path: .deploy
          sparse-checkout: |
            ci
            services
      # Tệp của repo deploy không thuộc mã dịch vụ: đưa ra ngoài thư mục làm việc để không lọt vào ngữ cảnh build.
      - name: Đưa tệp của repo deploy ra ngoài thư mục build
        run: mv .deploy "$RUNNER_TEMP/deploy"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Có đóng gói không
        id: decide
        env:
          BSN_REPO_PREFIX: ${{ inputs.repo-prefix }}
        run: BSN_DEPLOY_DIR="$RUNNER_TEMP/deploy" node "$RUNNER_TEMP/deploy/ci/decide.js"
      - name: Thiếu secret Docker Hub
        if: steps.decide.outputs.build == 'true' && (env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '')
        run: echo "::warning::Thiếu DOCKERHUB_USERNAME hoặc DOCKERHUB_TOKEN nên KHÔNG đẩy bản. Commit này chưa có bản đóng gói và chưa ghim được."
      - name: Đóng gói
        if: steps.decide.outputs.build == 'true'
        env:
          TARGET: ${{ steps.decide.outputs.target }}
          SERVICE: ${{ steps.decide.outputs.service }}
          REPO_NAME: ${{ steps.decide.outputs.repo_name }}
        run: |
          set -euo pipefail
          args=(build --platform linux/amd64 -t "bsn-local:$GITHUB_SHA"
            --build-arg BUILDKIT_INLINE_CACHE=1
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --label "bsn.service=$SERVICE"
            --label "bsn.branch=$GITHUB_REF_NAME"
            --label "bsn.commit=$GITHUB_SHA"
            --label "bsn.run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          # Dùng lại lớp từ bản gần nhất của chính dịch vụ này (máy của GitHub là máy trắng, không tự nhớ lớp nào):
          # lớp không đổi thì giữ nguyên mã băm và không phải tải lên lại. Không tìm được bản trước thì build bình thường.
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            prev=$(curl -fsS --max-time 20 "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/$REPO_NAME/tags/?page_size=50&ordering=last_updated" 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const t=(JSON.parse(s).results||[]).map(x=>x.name).find(n=>/^main-[0-9a-f]{12}$/.test(n));if(t)console.log(t)}catch{}})' || true)
            if [ -n "$prev" ]; then
              echo "Dùng lại lớp từ $REPO_NAME:$prev"
              args+=(--cache-from "$DOCKERHUB_USERNAME/$REPO_NAME:$prev")
            else
              echo "Chưa có bản trước của $REPO_NAME: build không có bộ nhớ đệm."
            fi
          fi
          docker "${args[@]}" .
      - name: Quét bí mật trong bản (kho Docker Hub là công khai)
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/image-fs"
          mkdir -p "$dir"
          cid=$(docker create "bsn-local:$GITHUB_SHA")
          # tar có thể báo lỗi với tệp thiết bị của ảnh nền; không coi đó là hỏng, nhưng bung ra rỗng thì dừng (quét thư mục rỗng là qua giả).
          docker export "$cid" | tar -x -C "$dir" --no-same-owner 2>/dev/null || true
          docker rm "$cid" >/dev/null
          count=$(find "$dir" -type f | wc -l)
          echo "Bung được $count tệp từ bản đóng gói"
          if [ "$count" -lt 1 ]; then echo "::error::Không bung được hệ tệp của bản đóng gói nên không quét được."; exit 1; fi
          docker history --no-trunc --format '{{.CreatedBy}}' "bsn-local:$GITHUB_SHA" > "$RUNNER_TEMP/image-history.txt"
          node "$RUNNER_TEMP/deploy/ci/scan-image.js" --dir "$dir" --history "$RUNNER_TEMP/image-history.txt"
      - name: Đăng nhập Docker Hub
        if: steps.decide.outputs.build == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Đẩy bản lên Docker Hub
        if: steps.decide.outputs.build == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          REPO_NAME: ${{ steps.decide.outputs.repo_name }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          image="$DOCKERHUB_USERNAME/$REPO_NAME:$TAG"
          # Một commit chỉ có MỘT bản: đã có thì không ghi đè (chạy lại workflow không đổi thứ đã được ghim).
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Đã có $image từ lần chạy trước: không đẩy lại."
          else
            docker tag "bsn-local:$GITHUB_SHA" "$image"
            docker push "$image"
            echo "Đã đẩy $image"
          fi
          echo "### Bản đóng gói: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
