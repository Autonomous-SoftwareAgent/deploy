# Test của repo deploy: tờ khai báo, lệnh điều khiển và các tệp phụ của CI. Không cần Docker, không cần mạng.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Danh tính git cho các test tạo repo tạm
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Kiểm các tờ khai báo
        run: node bsn.js check
      - name: Test lệnh điều khiển và tệp phụ của CI
        run: node --test test/*.test.js ci/test/*.test.js
