id: "luong-quyet-dinh-dong-goi"
type: "flowchart"
title: "Một lần chạy có được đóng gói không (ci/decide.js)"
tab: "business"
sources:
  - "ci/decide.js"
  - ".github/workflows/service-image.yml"
explain:
  meaning: "Sơ đồ là luật quyết định một lần chạy trên GitHub có sinh ra bản đóng gói hay không. Nó quan trọng vì đây là chỗ giữ lời hứa không có build tự động: thứ lên kho công khai luôn là thứ dịch vụ đã chủ động khai."
  read:
    - "Đọc từ trên xuống; mỗi hình thoi là một câu hỏi có hai lối ra."
    - "Các câu hỏi được hỏi đúng theo thứ tự trong hình; rẽ sang phải ở câu nào thì dừng ở đó."
    - "Ô đỏ là lỗi làm job đỏ; ô xám là không đóng gói nhưng job vẫn xanh; ô xanh lá là có bản."
  details:
    - term: "bsn.ci.json hợp lệ và tên repo đúng?"
      text: "Tệp ở gốc repo dịch vụ khai tên dịch vụ; tên repo trên GitHub phải là tiền tố svc- cộng tên đó, để một repo không đẩy được bản dưới tên dịch vụ khác."
    - term: "Sự kiện là push hoặc chạy tay?"
      text: "Pull request chỉ chạy test. Chạy tay (workflow_dispatch) dùng khi lỡ đẩy mã trước khi khai báo."
    - term: "Nhánh là main?"
      text: "Hiện chỉ nhánh main được đóng gói; khai thêm nhánh khác trong buildBranches thì nhánh đó bị bỏ qua kèm ghi chú."
    - term: "Có tờ khai báo của dịch vụ?"
      text: "Tệp services/<dịch-vụ>.json trong repo deploy, đọc ở bản mới nhất của nhánh main lúc workflow chạy."
    - term: "Commit đang chạy = commit đã khai?"
      text: "So đủ 40 ký tự. Tờ khai báo chưa ghim commit nào cũng tính là khác."
    - term: "LỖI: job đỏ"
      text: "Lỗi cấu hình của repo dịch vụ, phải sửa rồi mới chạy được; khác với việc không được đóng gói."
    - term: "KHÔNG đóng gói: job xanh"
      text: "Lần chạy vẫn có giá trị: kết quả test. Nhật ký ghi commit nào đang được khai và phải làm gì để đóng gói commit này."
    - term: "ĐÓNG GÓI"
      text: "Build cho linux/amd64, quét bí mật, rồi đẩy. Thiếu secret Docker Hub thì build và quét vẫn chạy nhưng không đẩy, kèm cảnh báo."
  pitfalls:
    - "Commit chỉ sửa tài liệu mà được khai thì VẪN được đóng gói: luật cũ bỏ qua commit chỉ sửa tài liệu đã bị bỏ."
    - "Hình không vẽ bước test: test là job riêng của dịch vụ chạy trước, nền không kiểm được dịch vụ có khai nó hay không."
    - "Đóng gói chưa chắc là có bản mới: bản của commit đó đã có thì không ghi đè, và bước quét bí mật có thể dừng trước khi đẩy."
  basis: "c5be36e49d210bbb"
direction: "TB"
