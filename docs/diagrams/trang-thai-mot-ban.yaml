id: "trang-thai-mot-ban"
type: "state"
title: "Vòng đời của một bản (một commit của một dịch vụ)"
tab: "architecture"
sources:
  - "src/application/pin.js"
  - "src/application/stack.js"
  - "src/application/images.js"
  - "ci/decide.js"
  - "ci/prune-images.js"
explain:
  meaning: "Sơ đồ theo một commit của một dịch vụ từ lúc chưa ai khai tới lúc bản của nó bị dọn khỏi kho. Nó trả lời hai câu người vận hành hay hỏi: bản này đã chạy được chưa, và còn lùi về nó được không."
  read:
    - "Đọc từ trên xuống; nhãn trên mũi tên là việc làm bản đổi trạng thái."
    - "Màu vàng là đang chờ, xanh dương là có bản dùng được, xanh lá là đang chạy, đỏ là không còn bản."
    - "Mũi tên quay ngược từ bản ghim liền trước về có bản là đường quay lui."
  details:
    - term: "Chưa khai"
      text: "Commit có trong repo dịch vụ nhưng không nằm trong tờ khai báo; đẩy nó lên chỉ chạy test."
    - term: "Đã khai, chờ build"
      text: "Commit đã được ghim nhưng chưa có bản; lệnh images báo CHỜ BUILD. Chưa chạy được bằng up --pull."
    - term: "Có bản trên Docker Hub"
      text: "Bản nhãn main-<12 ký tự commit>, đã qua test của dịch vụ và bước quét bí mật."
    - term: "Đang chạy ở hệ local"
      text: "Container mang nhãn commit; lệnh status báo khi container đang chạy từ commit khác bản ghim."
    - term: "Bản ghim liền trước (còn giữ)"
      text: "Commit vừa bị thay bởi lần ghim mới hơn; bước dọn không bao giờ xóa bản này, để luôn lùi được một bước."
    - term: "Bị dọn"
      text: "Bản đã bị workflow prune xóa khỏi Docker Hub; mã vẫn còn trong repo dịch vụ nhưng chưa có cách build lại bằng workflow."
    - term: "pin: ghi commit vào tờ khai báo"
      text: "Lệnh node infra/bsn.js pin <dịch-vụ> --apply, rồi commit và đẩy repo deploy."
    - term: "ghim commit khác trước khi có bản"
      text: "Mỗi dịch vụ chỉ khai một commit; khai commit khác thì commit cũ không còn được đóng gói nữa."
  pitfalls:
    - "Trạng thái này KHÔNG được lưu ở đâu: nó được suy ra mỗi lần hỏi, từ tờ khai báo, từ Docker Hub và từ container đang chạy."
    - "Đang chạy ở đây là ở máy làm việc. Chạy trên máy chủ GCP CHƯA có."
    - "Bản không phải bản đang ghim hay bản liền trước vẫn được giữ nếu còn nằm trong N bản mới nhất (N là registry.keep, hiện là 20)."
    - "Bước dọn (workflow prune) chưa chạy lần nào trên GitHub, nên chưa bản nào thật sự bị dọn."
  basis: "f1bdb02c2831561e"
