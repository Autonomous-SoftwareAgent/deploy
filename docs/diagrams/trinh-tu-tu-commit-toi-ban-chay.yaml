id: "trinh-tu-tu-commit-toi-ban-chay"
type: "sequence"
title: "Từ commit của dịch vụ tới bản đóng gói (khai báo trước, build sau)"
tab: "business"
sources:
  - ".github/workflows/service-pin.yml"
  - ".github/workflows/service-image.yml"
  - "ci/decide.js"
  - "ci/smoke.js"
  - "ci/scan-image.js"
explain:
  meaning: "Sơ đồ cho biết một commit của dịch vụ thành một bản đóng gói trên Docker Hub theo đường nào. Điều cốt lõi: bản chỉ được đóng cho commit ĐÃ KHAI trong tờ khai báo, và chính commit đó được test và bật thử trước khi đẩy, dù lần đẩy mã đang ở commit nào."
  read:
    - "Đọc từ trên xuống theo số thứ tự bước."
    - "Ba bước đầu là việc ở máy của phiên dịch vụ: commit, khai, rồi mới đẩy mã."
    - "Từ bước 4 là việc trên máy của GitHub; job pin chạy trước job test để biết phải test commit nào."
    - "Khung rẽ nhánh cuối: chỉ nhánh trên mới tạo ra bản; nhánh còn lại chỉ chạy test."
  details:
    - term: "Repo deploy"
      text: "Nơi giữ tờ khai báo services/<dịch-vụ>.json (muốn chạy commit nào) và mã của workflow dùng chung."
    - term: "Workflow dùng chung"
      text: "Hai workflow gọi lại được của repo deploy: service-pin (quyết định) và service-image (build, quét, bật thử, đẩy). Dịch vụ không viết lại các bước này."
    - term: "Bước 6"
      text: "decide.js đọc commit đã khai, kiểm nó thuộc nhánh main, và hỏi Docker Hub xem bản của nó đã có chưa; đã có thì không đóng lại."
    - term: "Bước 8"
      text: "Job test của dịch vụ chạy trên cả commit đang đẩy lẫn commit đã khai (khi hai commit khác nhau)."
    - term: "Docker Hub"
      text: "Kho công khai; nhãn bản là main- cộng 12 ký tự đầu của mã commit, không có nhãn latest."
  pitfalls:
    - "Đẩy mã không làm ra bản: commit chưa được khai thì lần chạy chỉ test, kể cả khi test xanh."
    - "Bộ quét bí mật chỉ bắt các dạng thường gặp; qua được không chứng minh bản sạch."
    - "Bật thử chỉ gọi đường kiểm sức khỏe với PostgreSQL và broker tạm; không chứng minh bản chạy đúng với hệ thật."
    - "Sơ đồ dừng ở bản trên kho; đưa bản lên một môi trường là việc của lệnh deploy hay bảng điều khiển (sơ đồ khác)."
  basis: "61b89b27478cff9d"
autonumber: true
participants:
  - id: "phien"
    label: "Phiên của dịch vụ"
    actor: true
  - id: "deploy"
    label: "Repo deploy"
    actor: false
  - id: "dich_vu"
    label: "Repo dịch vụ"
    actor: false
  - id: "workflow"
    label: "Workflow dùng chung"
    actor: false
  - id: "hub"
    label: "Docker Hub"
    actor: false
steps:
  - message:
      from: "phien"
      to: "phien"
      text: "Commit mã ở máy, chạy test của dịch vụ"
      reply: false
  - message:
      from: "phien"
      to: "deploy"
      text: "pin: ghi mã commit vào services/<dịch-vụ>.json, commit và đẩy"
      reply: false
  - message:
      from: "phien"
      to: "dich_vu"
      text: "Đẩy mã lên nhánh main"
      reply: false
  - message:
      from: "dich_vu"
      to: "workflow"
      text: "Job pin: gọi service-pin"
      reply: false
  - message:
      from: "workflow"
      to: "deploy"
      text: "Lấy ci/ và services/ về"
      reply: false
  - message:
      from: "workflow"
      to: "hub"
      text: "decide.js: commit đã khai có thuộc nhánh main không, bản của nó đã có chưa"
      reply: false
  - message:
      from: "workflow"
      to: "dich_vu"
      text: "Trả commit cần test và có cần đóng gói không"
      reply: true
  - message:
      from: "dich_vu"
      to: "dich_vu"
      text: "Job test của dịch vụ, chạy trên commit đang đẩy và commit đã khai"
      reply: false
  - alt:
      branches:
        - when: "Commit đã khai thuộc main và chưa có bản"
          steps:
            - message:
                from: "dich_vu"
                to: "workflow"
                text: "Test qua: gọi service-image với đúng commit đã khai"
                reply: false
            - message:
                from: "workflow"
                to: "hub"
                text: "Hỏi bản main- gần nhất để dùng lại lớp"
                reply: false
            - message:
                from: "workflow"
                to: "workflow"
                text: "Build từ commit đã khai; scan-image.js quét bí mật; smoke.js bật thử và gọi đường kiểm sức khỏe"
                reply: false
            - message:
                from: "workflow"
                to: "hub"
                text: "Đẩy svc-<dịch-vụ>:main-<12 ký tự commit>"
                reply: false
      otherwise:
        steps:
          - note:
              over:
                - "workflow"
              text: "Không đóng gói: chỉ chạy test; nhật ký nêu lý do. Thiếu secret Docker Hub thì lần chạy đỏ"
