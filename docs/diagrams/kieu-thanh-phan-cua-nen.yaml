id: "kieu-thanh-phan-cua-nen"
type: "class"
title: "Bốn lớp của repo deploy và chiều phụ thuộc giữa chúng"
tab: "architecture"
sources:
  - "src/composition.js"
  - "src/application/ports.js"
  - "src/interfaces/cli/index.js"
  - "src/interfaces/http/server.js"
  - "src/interfaces/web/main.js"
  - "src/application/deploy.js"
  - "src/application/console.js"
  - "src/domain/deploy-policy.js"
  - "src/infrastructure/docker-runtime.js"
  - "src/infrastructure/memory/world.js"
  - "test/architecture.test.js"
explain:
  meaning: "Sơ đồ cho biết mã của repo deploy chia thành những phần nào và phần nào được phép dùng phần nào. Điều quan trọng với người vận hành: luật deploy (khi nào từ chối, khi nào tự lùi) chỉ viết một lần ở lớp domain, và dòng lệnh, bảng điều khiển trên trình duyệt hay agent gọi JSON đều đi qua cùng các ca sử dụng, nên ba cửa không thể cho ba kết quả khác nhau."
  read:
    - "Đọc từ trên xuống: trên cùng là các cửa vào (xanh dương), giữa là ca sử dụng (xanh lá) và các cổng (vàng), dưới là luật thuần (xanh ngọc) và bộ nối (xám)."
    - "Mũi tên nét đứt 'phụ thuộc' đọc là: phần ở gốc mũi tên DÙNG phần ở đầu mũi tên. Không có mũi tên nào đi từ dưới lên các cửa vào."
    - "Mũi tên 'cài đặt' từ hai nhóm bộ nối tới các cổng: bộ nối thật và bộ nối trong bộ nhớ cùng cài một bộ cổng, nên thay nhau được."
    - "Ô hồng composition.js là nơi duy nhất biết cả bộ nối lẫn ca sử dụng; nó lắp chúng lại rồi đưa cho cửa vào."
  details:
    - term: "interfaces/cli (dòng lệnh)"
      text: "Mỗi lệnh một tệp trong commands/, cùng một hình dạng {name, usage, run}. index.js là chỗ duy nhất của dòng lệnh quyết định mã thoát."
    - term: "interfaces/http (máy chủ web)"
      text: "Bảng định tuyến và chuỗi lớp chặn; bộ điều khiển chỉ đổi yêu cầu thành lời gọi ca sử dụng và đổi kết quả có tên thành mã HTTP. Chỉ nghe trên 127.0.0.1."
    - term: "interfaces/web (giao diện)"
      text: "Tệp trình duyệt tải thẳng, không có bước build. Chỉ nói chuyện với máy chủ qua api.js; không nhập gì từ các lớp khác."
    - term: "application: ca sử dụng"
      text: "Mỗi ca sử dụng một tệp, nhận đúng các cổng nó cần. Trả kết quả chứ không in và không thoát. switchVersion là khung chung của deploy và rollback."
    - term: "application: bảng điều khiển"
      text: "Trang trạng thái gộp, sổ các việc (cùng dịch vụ thì từ chối việc thứ hai, khác dịch vụ thì song song) và đăng nhập. Không có luật deploy riêng."
    - term: "application/ports.js (các cổng)"
      text: "Danh sách những gì ca sử dụng cần ở bên ngoài, khai bằng JSDoc. Mọi hàm trả Promise. Hình dạng được giữ bằng test/contract.test.js."
    - term: "domain (luật thuần)"
      text: "Không nhập module nào ngoài chính lớp này: không tệp, không tiến trình, không mạng. Vào là dữ kiện, ra là quyết định có tên."
    - term: "infrastructure: bộ nối thật"
      text: "Dịch lời gọi của cổng thành lệnh docker, git, đọc ghi tệp, gọi HTTP. process-runner.js là nơi duy nhất chạy lệnh ngoài một cách đồng bộ."
    - term: "infrastructure/memory: bộ nối trong bộ nhớ"
      text: "Cùng các cổng nhưng mọi thứ nằm trong một đối tượng. Dùng cho test và cho bảng điều khiển chạy với --memory."
    - term: "composition.js (nơi lắp ráp)"
      text: "Tạo bộ nối, kiểm chúng có đủ hàm của cổng, rồi lắp vào ca sử dụng. Không tệp nào khác tự tạo bộ nối."
  pitfalls:
    - "Sơ đồ vẽ chiều phụ thuộc ĐƯỢC PHÉP; thứ giữ cho mã không đi sai chiều là test/architecture.test.js (quét mọi lệnh nhập), không phải hình này."
    - "Mỗi ô gộp nhiều tệp; số tệp thật và lệnh nhập giữa chúng xem ở sơ đồ tự sinh từ mã."
    - "Bộ nối thật cho Docker và Docker Hub không nằm trong bộ test hợp đồng (cần Docker); chúng được kiểm bằng lần thử thật."
    - "Mũi tên từ giao diện tới máy chủ web là lời gọi HTTP lúc chạy, không phải lệnh nhập trong mã."
    - "Chưa có bộ nối cho mô hình hai máy (máy quản trị điều khiển máy chạy thật): hiện đích luôn là máy đang chạy lệnh."
    - "Hình không vẽ thư mục ci/ (chạy trên máy của GitHub, đứng ngoài bốn lớp) và các tệp dữ liệu trên đĩa; xem sơ đồ quyết định đóng gói và bảng trong ARCHITECTURE.md."
  basis: "0f4a63d6fe7ba003"
