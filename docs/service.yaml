  depends_on:
    - target: "GitHub"
      kind: "external"
      via: "GitHub Actions; tổ chức Autonomous-SoftwareAgent; lệnh gh"
      purpose: "Chạy workflow test và đóng gói; giữ repo deploy và repo các dịch vụ; giữ secret DOCKERHUB_USERNAME và DOCKERHUB_TOKEN ở cấp tổ chức. Không còn là nơi ra lệnh deploy"
    - target: "Docker Hub"
      kind: "external"
      via: "docker push, docker pull, docker manifest inspect; API liệt kê và xóa nhãn"
      purpose: "Kho bản đóng gói công khai, mỗi dịch vụ một kho svc-<dịch-vụ>"
    - target: "GCP"
      kind: "external"
      via: "Dự án ai-sdlc-bsn; một máy thử e2-small đang tắt"
