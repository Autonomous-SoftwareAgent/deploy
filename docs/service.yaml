problems:
  - id: "P-001"
    title: "Chưa có hệ chạy thường trực trên máy chủ: mới thử trên một máy thử, mô hình hai máy chưa có"
    severity: "high"
    status: "refining"
    found: "2026-10-07"
    updated: "2026-10-07"
    detail: "Lệnh deploy và rollback đã chạy đúng trên hệ local và trên một máy thử GCP (lệnh chạy ngay trên máy đó), và bảng điều khiển web đã có. Nhưng chưa có máy nào chạy thường trực: máy thử đang tắt; máy chủ vẫn phải có repo của dịch vụ để lấy tệp cấu hình và build đồ giả lập; cấu hình và mật khẩu là loại dùng cho local; bảng điều khiển chỉ nghe trên 127.0.0.1 của máy nó chạy và chưa được đóng gói. Hệ quả: chưa dịch vụ nào nhận được yêu cầu thật của khách hay của cổng thanh toán."
    refine: "2026-10-07: (1) lệnh deploy và rollback, thử thật ở local. (2) Máy thử GCP e2-small: server/setup.sh dựng máy mới tinh, cả hệ khỏe sau 2 phút 9 giây, deploy, bản hỏng tự lùi và rollback đều chạy; lộ ra rằng chờ khỏe 25 giây là quá ngắn cho máy nhỏ. (3) Người dùng đổi hướng: bỏ nút bấm trên GitHub, deploy từ bảng điều khiển web của repo này; mã chuyển sang bốn lớp (D-007). Còn lại: đóng gói bảng điều khiển, hai máy trên GCP, cấu hình và bí mật thật, bước người duyệt."
    refs:
      - "S-017"
      - "S-023"
      - "D-007"
      - "DEP-S-001"
      - "BDK-S-001"
      - "src/application/switch-version.js:22"
      - "ROADMAP.md"
  - id: "P-002"
    title: "Không build lại được commit cũ đã bị dọn bản, hay commit không nằm ở đầu nhánh"
    severity: "medium"
    status: "refining"
    found: "2026-10-07"
    updated: "2026-10-08"
    detail: "Workflow dùng chung chỉ đóng gói commit ở đầu nhánh main của lần chạy. Nếu một dịch vụ muốn lùi về một commit cũ mà bản của nó đã bị workflow prune xóa, hoặc khai một commit nằm giữa lịch sử, thì không lần chạy nào đóng gói nó. Hệ quả: lúc sự cố có thể không lùi được về bản mong muốn. Giảm nhẹ hiện có: bản đang ghim và bản ghim liền trước không bao giờ bị dọn."
    refine: "2026-10-08 (D-010): workflow service-pin và service-image đóng gói đúng commit ghi trong tờ khai báo, dù nó nằm dưới đầu nhánh, miễn commit đó đã có trên nhánh main và chưa có bản; job test chạy trên cả đầu nhánh lẫn commit đó. Lùi về commit cũ mà bản đã bị dọn vì vậy đóng gói lại được. Mới có test ở máy (ci/test/ci.test.js); CHƯA chạy trên GitHub, nên chưa đóng vấn đề."
    refs:
      - "S-029"
      - "D-010"
      - "GOI-S-001"
      - "ci/decide.js"
      - ".github/workflows/service-pin.yml"
  - id: "P-003"
    title: "Bộ quét bí mật chỉ bắt các dạng thường gặp"
    severity: "medium"
    status: "open"
    found: "2026-10-07"
    updated: "2026-10-07"
    detail: "Kho Docker Hub công khai, nên bí mật lọt vào một bản là lộ hẳn, kể cả sau khi xóa bản. ci/scan-image.js chỉ tìm token có khuôn rõ (Docker Hub, GitHub, AWS, Google, Slack, khóa PEM), tệp .env, tệp khóa, thư mục .git và biến ENV/ARG tên như bí mật; nó bỏ qua thư mục thư viện và thư mục hệ thống của ảnh nền. Bí mật dạng khác (mật khẩu thường trong tệp cấu hình, token của nhà cung cấp lạ) không bị bắt. Chưa có quét lỗ hổng và chưa ký bản."
    refine: "Đã chạy bộ quét trên các bản thật của hai dịch vụ, không thấy gì trong các dạng được kiểm. Lớp chặn chính vẫn là .dockerignore và Dockerfile của từng dịch vụ."
    refs:
      - "D-004"
      - "ci/scan-image.js:13"
      - "ci/scan-image.js:22"
  - id: "P-004"
    title: "Nền không kiểm được dịch vụ có chạy test trước khi đóng gói"
    severity: "medium"
    status: "open"
    found: "2026-10-07"
    updated: "2026-10-07"
    detail: "Ý \"bản chỉ sinh ra sau khi test qua\" dựa vào dòng needs: test trong workflow của dịch vụ. Workflow dùng chung không nhìn thấy job test của bên gọi, nên một dịch vụ bỏ dòng đó vẫn được đóng gói. Hệ quả: một bản chưa qua test có thể được khai và chạy."
    refine: "Chưa xử lý. Hiện giữ bằng mẫu workflow trong skill cicd và bằng việc xem lại khi nối dịch vụ mới. Hướng: bước quyết định đọc workflow của dịch vụ và từ chối khi job image không có needs."
    refs:
      - "D-003"
      - ".github/workflows/service-image.yml:7"
  - id: "P-005"
    title: "Lên bản mới phụ thuộc thứ tự thao tác"
    severity: "low"
    status: "open"
    found: "2026-10-07"
    updated: "2026-10-07"
    detail: "Theo luật khai báo trước, build sau, quên ghim hoặc quên đẩy repo deploy trước khi đẩy mã thì lần chạy chỉ có test, không có bản; phải ghim rồi chạy tay workflow. Người hay agent không đọc nhật ký sẽ tưởng đã có bản. Lệnh images báo CHỜ BUILD nhưng không tự làm gì."
    refine: "Nhật ký của bước quyết định nêu rõ lý do và cách xử lý; phần tóm tắt của lần chạy trên GitHub cũng ghi. Đã thử thật cả hai chiều với hai dịch vụ ngày 2026-10-07."
    refs:
      - "S-029"
      - "ci/decide.js:40"
