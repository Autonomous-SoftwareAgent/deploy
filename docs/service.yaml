      kind: "service"
      via: "git archive trên repo ở system_service/<dịch-vụ>"
      purpose: "Lấy đúng commit được ghim để build và lấy tệp cấu hình"
  provides:
    - to: "Mọi dịch vụ"
      via: "Workflow Autonomous-SoftwareAgent/deploy/.github/workflows/service-image.yml@main và tệp bsn.ci.json ở gốc repo dịch vụ"
      purpose: "Đóng gói, quét bí mật và đẩy bản của commit đã khai"
    - to: "Mọi dịch vụ"
      via: "Khuôn tờ khai báo services/<dịch-vụ>.json và lệnh pin"
      purpose: "Khai commit muốn chạy và thứ cần để chạy"
    - to: "Người vận hành và agent"
      via: "Lệnh node infra/bsn.js (check, status, images, deploy, rollback có --json)"
      purpose: "Xem trạng thái, chạy cả hệ, đưa bản lên và lùi lại"
    - to: "Người vận hành"
      via: "Bảng điều khiển web: node infra/bsn.js console, http://127.0.0.1:8900"
      purpose: "Xem trạng thái từng dịch vụ, bấm Deploy và Rollback, xem lịch sử"
    - to: "Agent vận hành"
      via: "Đường gọi JSON của bảng điều khiển (/api/state, /api/services/<tên>/deploy|rollback, /api/jobs/<mã>) với token"
      purpose: "Cùng việc như người vận hành, qua HTTP"
    - to: "Harness"
      via: "Cây đã commit của repo deploy (services/)"
      purpose: "Kho ngữ nghĩa và bản đồ cả hệ đọc danh sách dịch vụ, cổng, topic"
