schema: 1
service: "infra"
title: "Nền deploy và vận hành (repo deploy)"
summary: "Nền dùng chung đưa một commit của bất kỳ dịch vụ nào thành bản đóng gói và chạy nó: dịch vụ khai commit muốn chạy, GitHub đóng gói sau khi test qua, rồi người hoặc agent đưa bản lên bằng dòng lệnh hoặc bảng điều khiển web của repo này. Bản không khỏe thì bản trước tự chạy lại. Đích là máy đang chạy lệnh; mô hình hai máy trên GCP chưa làm."
updated: "2026-10-08"
business:
  flows:
    - id: "len-ban-moi"
      steps:
        - "Dịch vụ commit mã ở máy và chạy test của nó"
        - "Dịch vụ ghim commit đó vào tờ khai báo của mình (lệnh pin), commit và đẩy repo deploy"
        - "Dịch vụ đẩy mã lên nhánh main của repo mình"
        - "GitHub chạy job test của dịch vụ"
        - "Workflow dùng chung so commit đang chạy với commit trong tờ khai báo: trùng thì đóng gói, quét bí mật, đẩy Docker Hub; không trùng thì dừng sau test"
        - "Bảng điều khiển (hoặc lệnh images) báo bản đã có; nút Deploy của dịch vụ đó mở ra"
      title: "Lên bản mới của một dịch vụ (khai báo trước, build sau)"
    - id: "day-truoc-khai-sau"
      steps:
        - "Lần đẩy chỉ chạy test, không có bản"
        - "Dịch vụ ghim commit, commit và đẩy repo deploy"
        - "Dịch vụ chạy tay workflow của mình (workflow_dispatch) trên nhánh main"
        - "Lần này commit trùng tờ khai báo nên được đóng gói"
      title: "Lỡ đẩy mã trước khi khai báo"
    - id: "deploy-qua-bang-dieu-khien"
      steps:
        - "Người vận hành đăng nhập (agent dùng token) và xem thẻ của dịch vụ: commit đã khai, bản đang chạy, đã có bản đóng gói chưa"
        - "Bấm Deploy và xác nhận; dịch vụ đang có lần đưa lên chạy dở thì bị từ chối"
        - "Bảng điều khiển giao việc cho một tiến trình riêng chạy đúng lệnh deploy"
        - "Lệnh kiểm bản đã có trên kho, kéo về, kiểm commit ghi bên trong, bật đúng dịch vụ đó và gọi đường kiểm sức khỏe"
        - "Khỏe thì sổ deploy ghi bản đang chạy và bản liền trước; trang hiện việc thành công kèm nhật ký"
        - "Không khỏe thì bản đang chạy trước đó tự được bật lại, sổ ghi lần hỏng, trang hiện việc hỏng; tờ khai báo không bị sửa"
      title: "Deploy một dịch vụ từ bảng điều khiển"
    - id: "quay-lui"
      steps:
        - "Người vận hành chọn một bản đã từng chạy khỏe ở đây (mặc định là bản liền trước) và bấm Rollback, hoặc gõ lệnh rollback"
        - "Commit chưa từng chạy khỏe trên đích này thì từ chối"
        - "Bản không còn ở máy và không còn trên Docker Hub thì từ chối"
        - "Bật bản đó và gọi đường kiểm sức khỏe"
        - "Khỏe thì ghi commit đó vào tờ khai báo ở máy; người vận hành commit và đẩy repo deploy để tờ trên GitHub khớp"
      title: "Quay lui về bản trước"
    - id: "chay-ca-he"
      steps:
        - "Lệnh up sinh mật khẩu của máy đó nếu chưa có"
        - "Bật tầng dùng chung: PostgreSQL và broker, chờ khỏe"
        - "Tạo cơ sở dữ liệu và topic mà từng dịch vụ khai"
        - "Lấy bản của commit được ghim: kéo bản CI (--pull) hoặc build tại chỗ từ đúng commit đó"
        - "Chạy các dịch vụ trên mạng chung, mỗi dịch vụ một cổng từ 8000, rồi chờ đường kiểm sức khỏe trả lời; khỏe thì ghi vào sổ deploy"
      title: "Chạy cả hệ trên một máy"
    - id: "don-ban-cu"
      steps:
        - "Mỗi tuần workflow prune liệt kê nhãn main-<commit> của từng dịch vụ"
        - "Giữ số bản mới nhất ghi trong platform.json, cùng bản đang ghim và bản ghim liền trước"
        - "Xóa các bản còn lại; nhãn không theo khuôn của nền thì không đụng"
      title: "Dọn bản cũ trên Docker Hub"
  goal: "Mọi dịch vụ lên bản mới và quay lui theo cùng một cách, không phụ thuộc người nào nhớ các bước: thứ chạy luôn là một commit đã được khai rõ và đã qua test, bản hỏng thì tự quay về bản trước, và thêm dịch vụ mới không phải sửa nền."
  out_of_scope:
    - "Mã, test và Dockerfile của dịch vụ"
    - "Job test trong workflow của dịch vụ"
    - "Bộ công cụ Claude (harness)"
    - "Quyết định dịch vụ nào chạy commit nào: đó là của từng dịch vụ; bảng điều khiển không cho chọn commit để deploy"
    - "Lùi dữ liệu: deploy và rollback chỉ đổi bản chương trình, dữ liệu trong cơ sở dữ liệu không lùi theo"
  unverified:
    - "Mô hình hai máy (máy quản trị điều khiển máy chạy thật): chưa có mã. Mới thử một máy tự chạy lệnh cho chính nó (máy làm việc, và một máy thử GCP)"
    - "Bảng điều khiển chưa chạy trên máy chủ nào và chưa được đóng gói; cách vào từ xa (đường hầm SSH) chưa làm"
    - "Người dùng thật chưa bấm trên trình duyệt với hệ thật: trình duyệt mới được thử ở chế độ bộ nhớ, hệ thật mới được thử qua đường gọi JSON"
    - "Rollback qua bảng điều khiển ghi lại tờ khai báo ở máy nhưng chưa tự đẩy lên GitHub"
    - "Máy chủ vẫn phải có repo của dịch vụ để lấy tệp cấu hình và build đồ giả lập; cấu hình và mật khẩu là loại dùng cho local"
    - "Chưa có bước người duyệt trước khi lên máy chạy thật"
    - "Trường hợp bật lại bản cũ cũng hỏng mới có test với Docker giả, chưa gặp thật"
    - "Bộ nối thật gọi lệnh docker đồng bộ: lúc bảng điều khiển đọc trạng thái, máy chủ web đứng trong vài trăm mili giây tới vài giây (khi hỏi kho bản); chưa đo trên máy chủ"
    - "Cửa vào trên cloud có TLS và chia đường theo cloud.route: chưa làm; cloud.route của mọi dịch vụ đang để trống"
    - "Sao lưu và khôi phục PostgreSQL và sổ deploy trên máy chủ: chưa làm"
    - "Workflow prune chưa chạy lần nào trên GitHub; chế độ strict của lệnh images và của workflow pins mới có test ở máy"
    - "Bước dùng lại lớp khi build mới đo với một bản không đổi mã; chưa đo với một commit sửa mã thật"
    - "Quay lui về một commit cũ mà bản đã bị dọn, và đóng gói một commit không nằm ở đầu nhánh main: workflow chưa làm được"
    - "Nền chưa kiểm được workflow của dịch vụ có khai needs: test trước job image hay không"
    - "Tầng dùng chung dùng một tài khoản PostgreSQL cho mọi dịch vụ; production phải tách tài khoản"
  users:
    - need: "Khai commit mình muốn chạy vào tờ khai báo của mình và có bản đóng gói đúng commit đó, không cần nhờ ai"
      who: "Phiên Claude của một dịch vụ (hoặc người viết dịch vụ)"
    - need: "Mở bảng điều khiển, thấy dịch vụ nào muốn chạy bản nào và đang chạy bản nào; bấm Deploy để đưa bản lên và Rollback để lùi lại"
      who: "Người vận hành (DevOps)"
    - need: "Làm mọi thao tác bằng lệnh hoặc đường gọi JSON và đọc kết quả có mã rõ ràng; biết ranh giới việc nào tự làm, việc nào chờ người duyệt"
      who: "Agent vận hành"
  value:
    - "Bản đang chạy truy được về đúng một commit: nhãn bản là mã commit, không dùng latest"
    - "Phần sửa dở trong thư mục làm việc không bao giờ lọt vào bản: build chỉ lấy từ commit được ghim"
    - "Chỉ commit được khai mới sinh bản, và chỉ sau khi test của dịch vụ qua"
    - "Bí mật không lên kho công khai: bản được quét trước khi đẩy"
    - "Bản không khỏe không ở lại: deploy tự bật lại bản đang chạy trước đó và báo lỗi"
    - "Luôn thấy chỗ lệch giữa bản dịch vụ muốn và bản đang chạy: tờ khai báo và sổ deploy là hai thứ riêng"
    - "Nút deploy không nằm trên GitHub của một repo công khai: chỉ người vào được máy quản trị và có mật khẩu mới đưa bản lên được"
    - "Hai người không deploy chồng lên nhau cùng một dịch vụ; dịch vụ khác nhau thì lên song song"
    - "Bảng điều khiển hỏng hay đang cập nhật không làm dừng dịch vụ nào và không cắt ngang lần đưa lên đang chạy"
    - "Thêm dịch vụ mới là thêm một tờ khai báo và hai tệp nhỏ trong repo dịch vụ"
architecture:
  summary: "Một dịch vụ thuần Node (chỉ thư viện có sẵn) gồm dòng lệnh, máy chủ web và giao diện, cùng bốn workflow GitHub Actions. Mã chia bốn lớp phụ thuộc một chiều: domain (luật thuần), application (ca sử dụng nói chuyện với bên ngoài qua cổng), infrastructure (bộ nối thật và bộ nối trong bộ nhớ cho từng cổng), interfaces (cli, http, web); một tệp duy nhất lắp ráp. Ranh giới do test quét lệnh nhập giữ. Dữ liệu duy nhất về từng dịch vụ là tờ khai báo JSON của nó; mã không chứa tên dịch vụ nào. Đích của deploy và rollback là máy đang chạy lệnh; mô hình hai máy chưa có. Thiết kế đầy đủ: docs/agent/ARCHITECTURE.md."
  layers:
    - id: "khai-bao"
      title: "Tờ khai báo (dữ liệu)"
      role: "Mỗi dịch vụ một tệp do chính nó ghi (commit, cổng, cơ sở dữ liệu, topic, tên biến bí mật) và cấu hình chung của nền"
      paths:
        - "services/"
        - "platform.json"
    - id: "domain"
      title: "Domain: luật thuần"
      role: "Luật của tờ khai báo, cách đặt tên bản, sổ deploy như một giá trị, quyết định deploy và rollback, mô tả chạy. Không nhập module nào ngoài chính lớp này"
      paths:
        - "src/domain/"
    - id: "application"
      title: "Application: ca sử dụng và cổng"
      role: "Mỗi ca sử dụng một tệp, nhận đúng các cổng nó cần, trả kết quả chứ không in và không thoát. ports.js khai mọi cổng"
      paths:
        - "src/application/"
    - id: "infrastructure"
      title: "Infrastructure: bộ nối"
      role: "Bộ nối thật (docker, git, tệp, HTTP, tiến trình con) và bộ nối trong bộ nhớ cho từng cổng; hai loại qua cùng một bộ test hợp đồng"
      paths:
        - "src/infrastructure/"
    - id: "interfaces"
      title: "Interfaces: dòng lệnh, máy chủ web, giao diện"
      role: "Ba cửa vào cùng gọi các ca sử dụng: lệnh bsn.js, máy chủ web chỉ nghe trên 127.0.0.1, và trang cho trình duyệt"
      paths:
        - "src/interfaces/"
        - "bsn.js"
    - id: "lap-rap"
      title: "Nơi lắp ráp"
      role: "Tệp duy nhất tạo bộ nối và lắp vào ca sử dụng, cho đích là máy này hoặc cho chế độ trong bộ nhớ"
      paths:
        - "src/composition.js"
    - id: "ci"
      title: "Tệp phụ và workflow của CI"
      role: "Chạy trên máy của GitHub: quyết định có đóng gói không, quét bí mật, dọn bản cũ. Không còn workflow deploy hay rollback"
      paths:
        - "ci/"
        - ".github/workflows/"
    - id: "may"
      title: "Tầng dùng chung và chuẩn bị máy"
      role: "PostgreSQL, broker và mạng chung của một đích; tệp chuẩn bị một máy Ubuntu"
      paths:
        - "local/docker-compose.yml"
        - "server/"
  components:
    - id: "to-khai-bao"
      title: "Tờ khai báo của dịch vụ"
      layer: "khai-bao"
      role: "Nơi duy nhất ghi dịch vụ muốn chạy commit nào và cần gì để chạy; tên tệp là tên dịch vụ"
      paths:
        - "services/"
    - id: "cau-hinh-nen"
      title: "Cấu hình chung của nền"
      layer: "khai-bao"
      role: "Tổ chức GitHub, tài khoản Docker Hub, tiền tố tên kho, nhánh được đóng gói, số bản giữ lại"
      paths:
        - "platform.json"
    - id: "luat-khai-bao"
      title: "Luật của tờ khai báo và cách đặt tên"
      layer: "domain"
      role: "validate (trùng cổng, commit sai dạng, nhãn latest, repo thoát ra ngoài), tên bản ở máy và trên kho, commit đọc từ nhãn của bản"
      paths:
        - "src/domain/declaration.js"
        - "src/domain/naming.js"
    - id: "luat-deploy"
      title: "Luật deploy và rollback"
      layer: "domain"
      role: "Từ chối, không đổi, hay chuyển bản; lùi về đâu; hỏng thì bật lại bản nào; các kết quả có tên"
      paths:
        - "src/domain/deploy-policy.js"
        - "src/domain/outcome.js"
    - id: "so-deploy"
      title: "Sổ deploy như một giá trị"
      layer: "domain"
      role: "Bản đang chạy, bản liền trước, 50 lần đưa lên gần nhất, kiểm số phiên bản của sổ"
      paths:
        - "src/domain/ledger.js"
    - id: "mo-ta-chay"
      title: "Mô tả chạy của dịch vụ"
      layer: "domain"
      role: "composeFor, serviceEnv: cổng, nhãn, địa chỉ cơ sở dữ liệu và broker do nền cấp"
      paths:
        - "src/domain/stack-plan.js"
    - id: "cong"
      title: "Các cổng"
      layer: "application"
      role: "Declarations, Source, ConfigFiles, Runtime, Registry, SharedTier, Secrets, Ledger, Locks, Health, Clock, Credentials, Hasher, Random, JobExecutor"
      paths:
        - "src/application/ports.js"
    - id: "ca-deploy"
      title: "Ca sử dụng deploy, rollback và khung chuyển bản"
      layer: "application"
      role: "Bật đúng một commit, chờ khỏe, hỏng thì bật lại bản trước, ghi sổ; khóa theo dịch vụ"
      paths:
        - "src/application/deploy.js"
        - "src/application/rollback.js"
        - "src/application/switch-version.js"
        - "src/application/service-lock.js"
    - id: "ca-he"
      title: "Ca sử dụng chạy cả hệ và xem trạng thái"
      layer: "application"
      role: "check, pin, build và kéo bản, bật và tắt cả hệ, trạng thái, bản trên kho"
      paths:
        - "src/application/check.js"
        - "src/application/pin.js"
        - "src/application/images.js"
        - "src/application/stack.js"
        - "src/application/prepare-tier.js"
        - "src/application/get-status.js"
        - "src/application/get-images.js"
    - id: "ca-bang-dieu-khien"
      title: "Ca sử dụng của bảng điều khiển"
      layer: "application"
      role: "Trang trạng thái gộp, nhận yêu cầu Deploy và Rollback, sổ việc, đăng nhập"
      paths:
        - "src/application/console.js"
        - "src/application/jobs.js"
        - "src/application/auth.js"
    - id: "bo-noi-that"
      title: "Bộ nối thật"
      layer: "infrastructure"
      role: "Tệp (tờ khai báo, sổ, khóa, bí mật), git, docker, kho bản, tầng dùng chung, kiểm sức khỏe, tiến trình con tách rời cho từng việc"
      paths:
        - "src/infrastructure/"
    - id: "bo-noi-bo-nho"
      title: "Bộ nối trong bộ nhớ"
      layer: "infrastructure"
      role: "Cùng các cổng trên một đối tượng dữ liệu mẫu; cho test và cho bảng điều khiển chạy với --memory"
      paths:
        - "src/infrastructure/memory/"
    - id: "dong-lenh"
      title: "Dòng lệnh bsn.js"
      layer: "interfaces"
      role: "check, status, images, pin, build, up, down, deploy, rollback, console; mỗi lệnh một tệp; lệnh làm thay đổi mặc định chỉ in kế hoạch"
      paths:
        - "bsn.js"
        - "src/interfaces/cli/"
    - id: "may-chu-web"
      title: "Máy chủ web của bảng điều khiển"
      layer: "interfaces"
      role: "Bảng định tuyến, chuỗi lớp chặn (tên máy, header bảo vệ, đăng nhập, chống giả mạo, đọc JSON), ba bộ điều khiển"
      paths:
        - "src/interfaces/http/"
    - id: "giao-dien"
      title: "Giao diện trên trình duyệt"
      layer: "interfaces"
      role: "Thẻ dịch vụ, nút Deploy và Rollback có hỏi lại, lịch sử, danh sách việc; không có bước build"
      paths:
        - "src/interfaces/web/"
    - id: "lap-rap"
      title: "Nơi lắp ráp"
      layer: "lap-rap"
      role: "localPorts, memoryPorts, assemble, buildLocalConsole, buildMemoryConsole"
      paths:
        - "src/composition.js"
    - id: "quyet-dinh-dong-goi"
      title: "Quyết định đóng gói"
      layer: "ci"
      role: "Chỉ đóng gói khi commit đang chạy trùng commit trong tờ khai báo, trên nhánh main, và repo đúng tên dịch vụ"
      paths:
        - "ci/decide.js"
    - id: "quet-bi-mat"
      title: "Quét bí mật trong bản"
      layer: "ci"
      role: "Tìm token có khuôn rõ, tệp .env, tệp khóa, thư mục .git, biến ENV/ARG mang giá trị bí mật; không in giá trị"
      paths:
        - "ci/scan-image.js"
    - id: "don-ban"
